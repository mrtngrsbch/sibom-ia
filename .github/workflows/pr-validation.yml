name: Validación de Pull Request

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-frontend:
    name: Validar Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chatbot
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ./chatbot/pnpm-lock.yaml
      
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      
      - name: Type checking (TypeScript)
        run: pnpm run type-check
      
      - name: Linting (ESLint)
        run: pnpm run lint
      
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      
      - name: Tests (Vitest)
        run: pnpm run test -- --run
        if: always()  # Correr tests incluso si falló build

  validate-backend:
    name: Validar Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-cli
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy
      
      - name: Linting (Ruff)
        run: ruff check .
      
      - name: Format check (Black)
        run: black --check .
      
      - name: Type checking (mypy)
        run: mypy . --ignore-missing-imports
        if: always()
      
      - name: Tests (pytest)
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest tests/ -v
          else
            echo "No tests found, skipping"
          fi
        if: always()

  validate-api:
    name: Validar API Satelital (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sat-analysis
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "requirements.txt no encontrado"
      
      - name: Verificar imports
        run: python -c "import api.main" || echo "API validation skipped"

  commit-lint:
    name: Validar Mensajes de Commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Validar formato de commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json
        continue-on-error: true  # No bloquear PR por esto

  security-scan:
    name: Escaneo de Seguridad
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Ejecutar Trivy (vulnerabilidades)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Verificar secrets expuestos
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  size-check:
    name: Verificar Tamaño de Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ./chatbot/pnpm-lock.yaml
      
      - name: Build frontend
        working-directory: ./chatbot
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      
      - name: Analizar tamaño de bundle
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: chatbot
        continue-on-error: true
