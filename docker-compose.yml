version: '3.8'

services:
  # Frontend Next.js
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: sibom-chatbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Montar índices RAG desde python-cli/data/indexes
      # El chatbot espera encontrarlos en /python-cli/...
      - ./python-cli/data/indexes/boletines_index.json:/python-cli/boletines_index.json:ro
      - ./python-cli/data/indexes/normativas_index_minimal.json:/python-cli/normativas_index_minimal.json:ro
      - ./python-cli/data/indexes/normativas_index.json:/python-cli/normativas_index.json:ro
    environment:
      - NODE_ENV=production
      - SAT_API_URL=http://sat-analysis:8001
      - NEXT_PUBLIC_SAT_API_URL=http://sat-analysis:8001
      # API Keys (desde archivo .env en raíz)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      # Configuración de modelos
      - LLM_MODEL_PRIMARY=${LLM_MODEL_PRIMARY}
      - LLM_MODEL_ECONOMIC=${LLM_MODEL_ECONOMIC}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      # Configuración de datos
      - USE_NORMATIVAS_INDEX=${USE_NORMATIVAS_INDEX}
      - USE_SQLITE=${USE_SQLITE}
    depends_on:
      sat-analysis:
        condition: service_healthy
    networks:
      - sibom-network

  # Backend FastAPI (sat-analysis)
  sat-analysis:
    build:
      context: ./sat-analysis
      dockerfile: Dockerfile
    container_name: sibom-sat-analysis
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - sat-data:/app/data
      - sat-cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - OUTPUT_DIR=/app/data/web_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sibom-network

  # Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: sibom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      chatbot:
        condition: service_healthy
      sat-analysis:
        condition: service_healthy
    networks:
      - sibom-network

  # Certbot para Let's Encrypt (renewal automático)
  certbot:
    image: certbot/certbot:latest
    container_name: sibom-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - sibom-network

volumes:
  sat-data:
    driver: local
  sat-cache:
    driver: local
  certbot-conf:
    driver: local
  certbot-www:
    driver: local

networks:
  sibom-network:
    driver: bridge
