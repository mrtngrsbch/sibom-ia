version: '3.8'

services:
  # Frontend Next.js
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: mangrullo-chatbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Montar índices RAG desde python-cli/data/indexes
      # El chatbot espera encontrarlos en /python-cli/...
      - ./python-cli/data/indexes/boletines_index.json:/python-cli/boletines_index.json:ro
      - ./python-cli/data/indexes/normativas_index_minimal.json:/python-cli/normativas_index_minimal.json:ro
      - ./python-cli/data/indexes/normativas_index.json:/python-cli/normativas_index.json:ro
    environment:
      - NODE_ENV=production
      - SAT_API_URL=http://sat-analysis:8001
      - NEXT_PUBLIC_SAT_API_URL=http://sat-analysis:8001
      # API Keys (desde archivo .env en raíz)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      # Configuración de modelos
      - LLM_MODEL_PRIMARY=${LLM_MODEL_PRIMARY}
      - LLM_MODEL_ECONOMIC=${LLM_MODEL_ECONOMIC}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      # Configuración de datos
      - USE_NORMATIVAS_INDEX=${USE_NORMATIVAS_INDEX}
      - USE_SQLITE=${USE_SQLITE}
    depends_on:
      sat-analysis:
        condition: service_healthy
    networks:
      - mangrullo-network

  # Backend FastAPI (sat-analysis)
  sat-analysis:
    build:
      context: ./sat-analysis
      dockerfile: Dockerfile
    container_name: mangrullo-sat-analysis
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - mangrullo-sat-data:/app/data
      - mangrullo-sat-cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - OUTPUT_DIR=/app/data/web_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mangrullo-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mangrullo-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - mangrullo-qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mangrullo-network

  # Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: mangrullo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      chatbot:
        condition: service_healthy
      sat-analysis:
        condition: service_healthy
    networks:
      - mangrullo-network

volumes:
  mangrullo-sat-data:
    driver: local
  mangrullo-sat-cache:
    driver: local
  mangrullo-qdrant-data:
    driver: local

networks:
  mangrullo-network:
    driver: bridge
