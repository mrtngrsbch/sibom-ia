events {
    worker_connections 1024;
}

http {
    upstream chatbot {
        server chatbot:3000;
    }

    upstream sat-api {
        server sat-analysis:8001;
    }

    # HTTP - Redirigir a HTTPS (cuando SSL esté configurado)
    server {
        listen 80;
        server_name mangrullo.microagencia.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Temporalmente servir HTTP directamente (sin redirección)
        # Descomentar la línea de abajo cuando SSL esté configurado
        # return 301 https://$server_name$request_uri;

        # Frontend Next.js
        location / {
            proxy_pass http://chatbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Sat-Analysis (endpoint directo)
        location /api/analyze {
            proxy_pass http://sat-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Imágenes satelitales
        location /images/ {
            proxy_pass http://sat-api/images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache de imágenes para mejor rendimiento
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }

    # HTTPS (descomentar cuando se tenga certificado SSL)
    server {
        listen 443 ssl http2;
        server_name mangrullo.microagencia.com;
