events {
    worker_connections 1024;
}

http {
    upstream chatbot {
        server chatbot:3000;
    }

    upstream sat-api {
        server sat-analysis:8001;
    }

    # HTTP - Redirigir a HTTPS (cuando SSL esté configurado)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Temporalmente servir HTTP directamente (sin redirección)
        # Descomentar la línea de abajo cuando SSL esté configurado
        # return 301 https://$server_name$request_uri;

        # Frontend Next.js
        location / {
            proxy_pass http://chatbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Sat-Analysis
        location /api/satelite/ {
            rewrite ^/api/satelite/(.*)$ /api/$1 break;
            proxy_pass http://sat-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS (descomentar cuando se tenga certificado SSL)
