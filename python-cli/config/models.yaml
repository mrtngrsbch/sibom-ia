# ============================================================================
# MAPEO DE SCRIPTS A MODELOS
# ============================================================================
# Define qué modelo usa cada script/función para tracking.
#
# script: nombre del script (ej: cli.py, sibom_scraper.py)
# function: función específica (opcional)
# model_id: ID del modelo en models[]
# task: tipo de tarea para stats
# ============================================================================
script_models:
  # Vision API (OCR de PDFs)
  - script: "vision_extractor.py"
    function: "extract_bulletin_with_vision"
    model_id: "google/gemini-2.5-flash-lite-preview-09-2025"
    task: "vision"

  - script: "vision_extractor.py"
    function: "VisionExtractor.extract_pdf"
    model_id: "google/gemini-2.5-flash-lite-preview-09-2025"
    task: "vision_tables"

  # SIBOM Scraper
  - script: "sibom_scraper.py"
    function: "SIBOMScraper.scrape"
    model_id: "zai/glm-4.7"
    task: "sibom_parsing"

  - script: "sibom_scraper.py"
    function: "SIBOMScraper._make_llm_call"
    model_id: "zai/glm-4.7"
    task: "sibom_parsing"

  # Transparency Scraper
  - script: "cli.py"
    function: "cmd_transparency"
    model_id: "google/gemini-2.5-flash-lite-preview-09-2025"
    task: "transparency"

  # Web Scraper
  - script: "web_scraper.py"
    function: "scrape_all_sources"
    model_id: null
    task: null
    notes: "No usa LLM, solo scraping HTTP"

