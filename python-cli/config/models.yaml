# ============================================================================
# CONFIGURACIÓN DE MODELOS LLM/VISION
# ============================================================================
# Archivo centralizado para TODA la configuración de modelos.
#
# - active: true  → Modelo en uso actualmente
# - free: true    → Modelo gratuito
# - vision: true  → Modelo con capacidades Vision API
#
# USO:
#   1. Cambiar active: true/false para alternar entre modelos
#   2. Ver precios actualizados en https://openrouter.ai/models
#   3. Documentar pruebas de calidad en "calidad" y "notes"
# ============================================================================

# Modelos por defecto
