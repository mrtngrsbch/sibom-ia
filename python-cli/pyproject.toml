[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibom-scraper"
version = "3.0.0"
description = "Scraper de normativas municipales argentinas desde SIBOM, sitios web y documentos de transparencia"
authors = [{name = "Martín", email = "martin@example.com"}]
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0.0",
    "pdfplumber>=0.11.0",
    "pdf2image>=1.16.0",
    "qdrant-client>=1.7.0",
    "tqdm>=4.66.0",
]

[tool.uv]
path-dependencies = []

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
select = ["E", "F", "I"]
fixable = ["ALL"]
exclude = [".venv", "venv", "__pycache__"]
